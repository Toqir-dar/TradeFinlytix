version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: tradefinlytix_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/tradefinlytix-backend:latest
    container_name: tradefinlytix_backend
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/tradefinlytix-frontend:latest
    container_name: tradefinlytix_frontend
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: tradefinlytix_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
